[project]
name = "customer-segmentation"
version = "0.1.0"
description = "A production-oriented customer segmentation pipeline that clusters retail customers by purchasing behavior and demographics to support targeted marketing decisions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.52.3",
]
ui = [
    "streamlit>=1.61.1",
    "requests>=2.32.0",
]
notebook = [
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "detect-secrets>=1.5.0",
    "dvc>=3.55.2",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["notebooks/"]
